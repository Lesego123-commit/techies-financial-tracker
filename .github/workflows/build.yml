name: Android CI Build & Test

# Part 3 requirement: use GitHub Actions to automatically build the app and run the
# automated tests on every push / pull request, so we know the code works on more than
# just one developer's machine.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK and run unit tests
    runs-on: ubuntu-latest

    # The Gradle project lives in a sub-folder of the repository.
    defaults:
      run:
        working-directory: BudgetTracker/BudgetTracker

    steps:
      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Remove machine-specific local.properties
        # The Android SDK location on the CI runner comes from ANDROID_SDK_ROOT, not from
        # the committed local.properties (which points to a developer's Windows machine).
        run: rm -f local.properties

      - name: Provide a google-services.json for the build
        # If the real google-services.json has not been committed, fall back to the structurally
        # valid CI placeholder kept in .github/. The real file (downloaded from the Firebase
        # console) is what the shipped app uses at runtime to reach the online database.
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "No google-services.json found – using the CI placeholder."
            cp ../../.github/google-services-ci.json app/google-services.json
          else
            echo "Using committed google-services.json."
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload the built APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: BudgetTracker/BudgetTracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

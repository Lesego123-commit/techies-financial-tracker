plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Google Services plugin – activates Firebase using the google-services.json file in this module.
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.budgettracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.budgettracker"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // AndroidX core libraries
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ---- Firebase (online database) ----
    // The Firebase BoM keeps all Firebase library versions in sync.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    // Realtime Database – the online database that stores users, categories, expenses and goals.
    implementation 'com.google.firebase:firebase-database-ktx'
    // Analytics – lightweight, confirms the Firebase connection is alive.
    implementation 'com.google.firebase:firebase-analytics-ktx'
    // Lets us await() Firebase Tasks inside Kotlin coroutines.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // MPAndroidChart – draws the "spending per category" bar chart with min/max goal lines (Part 3).
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Lifecycle / ViewModel / LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

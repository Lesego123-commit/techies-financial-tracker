// Top-level build file where you can add configuration options common to all sub-projects/modules.
// Part 3 update: Room/KSP removed, the Google Services (Firebase) plugin added so the app
// now persists all of its data in an online Firebase Realtime Database.
plugins {
    id 'com.android.application' version '8.2.0' apply false
    id 'com.android.library' version '8.2.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
    // Google Services plugin – reads google-services.json and configures Firebase for the app module.
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
